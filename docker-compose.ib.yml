services:
  db:
    image: mysql:8.0
    container_name: ${STACK_NAME}_db
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: sandbox
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile  # Используем продакшен Dockerfile
    container_name: ${STACK_NAME}_php
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Сохраняем extra_hosts
    volumes:
      # Монтируем ВСЕ файлы приложения, но перезаписываем закешированные
      - ./backend:/var/www/html
      # Исключаем перезапись закешированных файлов (используем то, что собрано в образе)
      - /var/www/html/vendor
      - /var/www/html/bootstrap/cache
      - /var/www/html/storage
    runtime: runc
    mem_limit: 3g
    ports:
      - "${WEB_PORT}:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:${WEB_PORT}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=sandbox
      - DB_USERNAME=root
      - DB_PASSWORD=
      - SESSION_DRIVER=file
      - CACHE_DRIVER=file
      - LOG_CHANNEL=stack
      - DOCKER_AGENT_URL=http://host.docker.internal:3001
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.dev
    container_name: ${STACK_NAME}_frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:${WEB_PORT}/api
      - WDS_SOCKET_PORT=${FRONTEND_PORT}
      - WDS_SOCKET_HOST=0.0.0.0
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=false
      - WATCHPACK_POLLING=false
      - NODE_OPTIONS=--max-old-space-size=2048
      - GENERATE_SOURCEMAP=false
      - ESLINT_NO_DEV_ERRORS=true
      - DISABLE_ESLINT_PLUGIN=true
      - WATCHPACK_WATCHER_LIMIT=1024
    stdin_open: true
    tty: true
    mem_limit: 4g
    mem_reservation: 2g
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    depends_on:
      - php
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ${STACK_NAME}_phpmyadmin
    ports:
      - "${PMA_PORT:-9088}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      PMA_ABSOLUTE_URI: http://localhost:9088/
      UPLOAD_LIMIT: 100M
    networks:
      - app-network
    depends_on:
      - db
  
networks:
  app-network:
    driver: bridge

volumes:
  db_data:
