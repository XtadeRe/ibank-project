version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ${STACK_NAME}_db
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_NAME:-compass_bank}
    volumes:
      - db_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - db-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ${STACK_NAME}_phpmyadmin
    ports:
      - "${PMA_PORT:-9088}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    networks:
      - db-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  db-network:
    driver: bridge

volumes:
  db_data:
