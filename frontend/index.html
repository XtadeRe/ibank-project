<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Compass Bank</title>
</head>
<body>
<h1>Compass Bank Demo</h1>

<div>
    <h2>Баланс: $<span id="balance">0</span></h2>
</div>

<div>
    <input type="number" id="amount" placeholder="Сумма">
    <button onclick="deposit()">Пополнить</button>
    <button onclick="withdraw()">Снять</button>
</div>

<div id="message"></div>

<div>
    <h3>История операций</h3>
    <ul id="transactions"></ul>
</div>

<script>
    let API_URL = null;

    async function getApiUrl() {
        try {
            const res = await fetch('http://localhost:3001/api/stacks/javaaa123/info');
            const data = await res.json();
            if (data.success && data.urls && data.urls.app) {
                API_URL = data.urls.app;
                console.log('API_URL установлен:', API_URL);
                return true;
            }
        } catch (e) {
            console.log('Стек не готов, повтор через 2с...');
        }
        return false;
    }

    async function waitForApiUrl(maxRetries = 30) {
        for (let i = 0; i < maxRetries; i++) {
            if (await getApiUrl()) return true;
            await new Promise(r => setTimeout(r, 2000));
        }
        console.error('Не удалось получить порт API');
        API_URL = 'http://localhost:8080'; // fallback
        return true;
    }

    async function loadBalance() {
        if (!API_URL) throw new Error('API_URL не установлен');
        const res = await fetch(`${API_URL}/api/balance`);
        const data = await res.json();
        document.getElementById('balance').innerText = data.balance;
    }

    async function loadTransactions() {
        const res = await fetch(`${API_URL}/api/transactions`);
        const transactions = await res.json();
        const list = document.getElementById('transactions');
        list.innerHTML = '';
        transactions.forEach(t => {
            const li = document.createElement('li');
            li.innerText = `${t.type}: $${t.amount} (${new Date(t.timestamp).toLocaleString()})`;
            list.appendChild(li);
        });
    }

    async function deposit() {
        const amount = parseFloat(document.getElementById('amount').value);
        const res = await fetch(`${API_URL}/api/deposit`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({amount: amount})
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('message').innerText = 'Пополнено';
            loadBalance();
            loadTransactions();
        } else {
            document.getElementById('message').innerText = data.error;
        }
    }

    async function withdraw() {
        const amount = parseFloat(document.getElementById('amount').value);
        const res = await fetch(`${API_URL}/api/withdraw`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({amount: amount})
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('message').innerText = 'Снято';
            loadBalance();
            loadTransactions();
        } else {
            document.getElementById('message').innerText = data.error;
        }
    }

    // Инициализация
    waitForApiUrl().then(() => {
        loadBalance();
        loadTransactions();
        setInterval(() => { loadBalance(); loadTransactions(); }, 5000);
    });
</script>
</body>
</html>
