services:
  php:
    build:
      context: ./DockerFiles
      dockerfile: Dockerfile
    container_name: ${STACK_NAME}_php
    restart: unless-stopped
    volumes:
      - .:/var/www
    expose:
      - "9000"
    networks:
      - app-network


  web:
    image: nginx:alpine
    container_name: ${STACK_NAME}_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
    depends_on:
      - php


  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ${STACK_NAME}_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-9088}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 100M
    networks:
      - app-network
    depends_on:
      - db

  db:
    image: mysql:8.4
    container_name: ${STACK_NAME}_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=sandbox
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_ALLOW_EMPTY_PASSWORD=no
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network



  frontend:
    build:
      context: .
      dockerfile: ./DockerFiles/Dockerfile_frontend
    container_name: ${STACK_NAME}_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOCKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_HOST=0.0.0.0
    networks:
      - app-network
    depends_on:
      - php


networks:
  app-network:
    driver: bridge


volumes:
  db_data:
